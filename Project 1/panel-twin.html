  }
  restore() { this.parent.attach(this.obj); this.obj.position.copy(this.saved.p); this.obj.quaternion.copy(this.saved.q) }
}

// ---------------------------------------------------------------- flow particles along paths

class Flow {
  /**
   * Streamlines that move: each particle is a short streak drawn along its path, bright at the head,
   * fading at the tail (reads like smoke in a wind tunnel, not dust).
   * lab.flow({ paths: [[[x,y,z],...], ...] (machine metres), count: 500, length: 0.06 (fraction of a path),
   *            color: (pathIndex, u) => [r,g,b], speed: 0.3 (path lengths per second), parent })
   *   f.speed and f.opacity are set each frame from the solver; f.colorFn can change live
   */
  constructor(lab, o) {
    this.lab = lab; this.o = o
    this.curves = o.paths.map((p) => p.isCurve ? p : new THREE.CatmullRomCurve3(p.map((q) => new THREE.Vector3(...q))))
    // sample every path once into a lookup table (getPointAt per frame is too slow)
    const S = 256
    this.lut = this.curves.map((c) => { const a = new Float32Array((S + 1) * 3); const v = new THREE.Vector3(); for (let i = 0; i <= S; i++) { c.getPointAt(i / S, v); a[i * 3] = v.x; a[i * 3 + 1] = v.y; a[i * 3 + 2] = v.z } return a })
    this.S = S
    const lens = this.curves.map((c) => c.getLength())
    const n = o.count ?? 500; this.n = n
    this.seg = o.segments ?? 8
    this.len = o.length ?? 0.07
    const R = rng(o.seed ?? 3)
    this.pi = new Uint16Array(n); this.u = new Float32Array(n); this.sp = new Float32Array(n)
    const tot = lens.reduce((x, y) => x + y, 0)
    for (let i = 0; i < n; i++) {
      let r = R() * tot, k = 0; while (r > lens[k] && k < lens.length - 1) { r -= lens[k]; k++ }
      this.pi[i] = k; this.u[i] = R(); this.sp[i] = 0.85 + R() * 0.3
    }
    this.speed = o.speed ?? 0.3
    this.colorFn = o.color ?? (() => [0.3, 0.55, 1])
    const V = n * this.seg * 2
    const g = new THREE.BufferGeometry()
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(V * 3), 3))
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(V * 4), 4))
    const paper = lab.theme === 'paper'
    const m = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: paper ? THREE.NormalBlending : THREE.AdditiveBlending, toneMapped: false })
    this.lines = new THREE.LineSegments(g, m); this.lines.frustumCulled = false; this.lines.layers.set(LAYER_FX); this.lines.renderOrder = 3
    ;(o.parent ?? lab.machine).add(this.lines)
    this.opacity = 1
    lab.onTick((dt) => this.update(dt))
  }
  _at(k, u, out, o) { const L = this.lut[k], f = clamp(u) * this.S, i = Math.min(this.S - 1, Math.floor(f)), t = f - i; for (let a = 0; a < 3; a++) out[o + a] = L[i * 3 + a] + (L[i * 3 + 3 + a] - L[i * 3 + a]) * t }
  update(dt) {
    const g = this.lines.geometry, P = g.attributes.position.array, C = g.attributes.color.array
    const seg = this.seg, op = this.opacity
    this.lines.visible = op > 0.003
    if (!this.lines.visible) return
    let v = 0
    for (let i = 0; i < this.n; i++) {
      const k = this.pi[i]
      this.u[i] = (this.u[i] + dt * this.speed * this.sp[i] * (this.o.perPath ? this.o.perPath[k] ?? 1 : 1)) % 1
      const head = this.u[i]
      const c = this.colorFn(k, head)
      const life = smoothstep(0, 0.08, head) * smoothstep(1, 0.9, head)
      for (let j = 0; j < seg; j++) {
        const u0 = head - (this.len * j) / seg, u1 = head - (this.len * (j + 1)) / seg
        this._at(k, u0, P, v * 3); this._at(k, u1, P, v * 3 + 3)
        const a0 = (1 - j / seg) * life * op, a1 = (1 - (j + 1) / seg) * life * op
        C.set([c[0], c[1], c[2], u0 < 0 ? 0 : a0, c[0], c[1], c[2], u1 < 0 ? 0 : a1], v * 4)
        v += 2
      }
    }
    g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true
  }
}

// ---------------------------------------------------------------- exhaust plume with shock diamonds

class Plume {
  /**
   * lab.plume({ parent, pos:[x,y,z], dir:'-y'|'+x'..., radius (exit, m), length (m), color:'rocket'|'jet'|'methalox', shocks: 6 })
   *   p.power = 0..1 (throttle), p.shocks = spacing in exit diameters, p.hot = 0..1
   */
  constructor(lab, o) {
    this.lab = lab
    const R = o.radius, L = o.length
    const geo = new THREE.CylinderGeometry(1, 1, 1, 64, 64, true).translate(0, -0.5, 0)
    this.u = { uT: { value: 0 }, uP: { value: 1 }, uShock: { value: o.shocks ?? 1.4 }, uKind: { value: o.color === 'jet' ? 1 : 0 }, uR: { value: R }, uL: { value: L }, uPaper: { value: lab.theme === 'paper' ? 1 : 0 }, uTint: { value: new THREE.Color(1, 1, 1) }, uSpread: { value: o.spread ?? 1 } }
    const m = new THREE.ShaderMaterial({
      uniforms: this.u, transparent: true, depthWrite: false, blending: lab.theme === 'paper' ? THREE.NormalBlending : THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexShader: `uniform float uR, uL, uP, uSpread; varying vec3 vP; varying vec3 vN; varying vec3 vV;
        void main(){ vec3 p = position; float y = -p.y; // 0 at exit, 1 at the tail
          float r = uR * (1.0 + y * (0.35 + 1.4 * y) * mix(0.6, 1.0, uP) * uSpread) ; p.xz *= r; p.y = -y * uL * mix(0.35, 1.0, uP);
          vP = vec3(p.x / uR, y, p.z / uR); vec4 mv = modelViewMatrix * vec4(p, 1.0); vN = normalize(normalMatrix * vec3(p.x, 0.0, p.z)); vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform float uT, uP, uShock, uKind, uPaper; uniform vec3 uTint; varying vec3 vP; varying vec3 vN; varying vec3 vV;
        float h(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
        float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y), mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
        void main(){ float y = vP.y; float f = abs(dot(normalize(vN), normalize(vV)));
          float core = pow(f, 1.6);
          float turb = n3(vec3(vP.x * 3.0, y * 9.0 - uT * 14.0, vP.z * 3.0)) * 0.6 + n3(vec3(vP.x * 7.0, y * 22.0 - uT * 30.0, vP.z * 7.0)) * 0.4;
          float diam = 0.5 + 0.5 * cos(y * 6.2831 * uShock * 2.2);
          float shock = pow(diam, 6.0) * smoothstep(0.75, 0.05, y) * core;
          float fade = smoothstep(1.0, 0.25, y) * smoothstep(0.0, 0.02, y);
          vec3 a = uKind > 0.5 ? vec3(0.55, 0.65, 1.0) : vec3(0.35, 0.45, 1.0);
          vec3 b = uKind > 0.5 ? vec3(1.0, 0.55, 0.25) : vec3(1.0, 0.45, 0.2);
          vec3 c = mix(a, b, smoothstep(0.05, 0.6, y)) * (0.35 + 0.9 * turb) * core * fade;
          c += vec3(1.0, 0.85, 0.65) * shock * 2.4 * (uKind > 0.5 ? 0.2 : 1.0);
          c *= uP * uTint;
          // on paper: normal blending, alpha from the light the gas emits, an HDR core that tone maps to white hot
          float al = clamp(max(c.r, max(c.g, c.b)) * 0.9, 0.0, 0.92);
          gl_FragColor = uPaper > 0.5 ? vec4(c * 1.8 / max(al, 0.12), al) : vec4(c, 1.0); }`,
    })
    const mesh = new THREE.Mesh(geo, m); mesh.layers.set(LAYER_FX); mesh.renderOrder = 4; mesh.frustumCulled = false
    const grp = new THREE.Group(); grp.add(mesh)
    if (o.pos) grp.position.set(...o.pos)
    const dir = { '-y': [0, 0, 0], '+y': [Math.PI, 0, 0], '+x': [0, 0, Math.PI / 2], '-x': [0, 0, -Math.PI / 2], '+z': [-Math.PI / 2, 0, 0], '-z': [Math.PI / 2, 0, 0] }[o.dir ?? '-y']
    grp.rotation.set(...dir)
    ;(o.parent ?? lab.machine).add(grp)
    this.group = grp; this.mesh = mesh
    this.power = 1
    lab.onTick((dt) => { this.u.uT.value += dt; this.u.uP.value = this.power; mesh.visible = this.power > 0.01 })
  }
  set shocks(v) { this.u.uShock.value = v }
  set tint(c) { this.u.uTint.value.setRGB(c[0], c[1], c[2]) }
}

// ------------------------------------------------------------------ the SCADA link: same origin when served by scada-sim.mjs, or ?scada=http://host:port
async function connect() {
  if (lab.filmMode) return
  const q = new URLSearchParams(location.search).get('scada')
  const base = q ?? (location.protocol.startsWith('http') ? location.origin : null)
  if (!base) return
  try { const h = await (await fetch(base + '/api/hello', { cache: 'no-store' })).json(); if (!h.scada) return; link.mb = h.modbus } catch { return }
  link.base = base
  const es = new EventSource(base + '/events'); link.es = es
  es.onmessage = (e) => { snap = JSON.parse(e.data); link.on = true; link.last = performance.now() }
  es.onerror = () => { link.on = false }
}
connect()

function drawScreen() {
  const g = SCR.getContext('2d'), w = SCR.width, h = SCR.height, s = snap.tags
  const on = s['VP1.HMI1.On'], run = s['VP1.TC1.Running']
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h)
  if (!on) return 0
  if (!run) {
    g.fillStyle = '#0b0b0c'; g.fillRect(0, 0, w, h)
    g.fillStyle = '#1d2a44'; g.fillRect(w / 2 - 210, h / 2 - 50, 420, 100); g.strokeStyle = '#4b6aa8'; g.lineWidth = 3; g.strokeRect(w / 2 - 210, h / 2 - 50, 420, 100)
    g.fillStyle = '#d6def0'; g.font = '600 34px Inter, Segoe UI, sans-serif'; g.textAlign = 'center'; g.fillText('No signal', w / 2, h / 2 + 4)
    g.font = '22px Inter, Segoe UI, sans-serif'; g.fillStyle = '#8fa0c4'; g.fillText(s['VP1.TC1.Mode'] === 1 ? `DisplayPort · thin client booting ${s['VP1.TC1.BootPct']} %` : 'DisplayPort · power save', w / 2, h / 2 + 36)
    return 0.35
  }
  // a high performance SCADA client: grey, colour only for abnormal
  g.fillStyle = '#d4d5d2'; g.fillRect(0, 0, w, h)
  g.fillStyle = '#3a3d42'; g.fillRect(0, 0, w, 64)
  g.fillStyle = '#eef0f2'; g.font = '600 28px Inter, Segoe UI, sans-serif'; g.textAlign = 'left'; g.fillText('VP-1  ·  Operator station', 26, 42)
  g.textAlign = 'right'; g.font = '24px JetBrains Mono, Consolas, monospace'; g.fillStyle = '#b8bcc2'
  const tt = Math.floor((snap.t ?? 0)); g.fillText(`${link.on ? 'SCADA live' : 'local solver'}  ·  t+${String(Math.floor(tt / 60)).padStart(2, '0')}:${String(tt % 60).padStart(2, '0')}`, w - 26, 42)
  const al = (snap.alarms ?? []).filter((a) => a.active)
  g.fillStyle = al.length ? '#f6e3e3' : '#e8e8e5'; g.fillRect(0, 64, w, 54)
  g.textAlign = 'left'; g.font = '600 24px Inter, Segoe UI, sans-serif'; g.fillStyle = al.length ? '#a10d24' : '#5d6066'
  g.fillText(al.length ? `▲ ${al[0].text}${al.length > 1 ? `   (+${al.length - 1})` : ''}` : 'No active alarms', 26, 100)
  const tile = (x, y, label, val, unit, frac, warn) => {
    g.fillStyle = '#e8e8e5'; g.fillRect(x, y, 370, 170); g.strokeStyle = warn ? '#c8102e' : '#b9bbbe'; g.lineWidth = warn ? 5 : 2; g.strokeRect(x, y, 370, 170)
    g.fillStyle = '#5d6066'; g.font = '600 22px Inter, Segoe UI, sans-serif'; g.fillText(label, x + 20, y + 38)
    g.fillStyle = '#1d1f22'; g.font = '600 68px Inter, Segoe UI, sans-serif'; g.fillText(val, x + 20, y + 112)
    const vw = g.measureText(val).width
    g.font = '30px Inter, Segoe UI, sans-serif'; g.fillStyle = '#5d6066'; g.fillText(unit, x + 32 + vw, y + 112)
    g.fillStyle = '#cfd0d2'; g.fillRect(x + 20, y + 136, 330, 12); g.fillStyle = warn ? '#c8102e' : '#5b5e63'; g.fillRect(x + 20, y + 136, 330 * clamp(frac), 12)
  }
  tile(26, 140, '24 V bus', fmt(s['VP1.Bus.Voltage'], 2), 'V', s['VP1.Bus.Voltage'] / 30, !s['VP1.Bus.OK'])
  tile(455, 140, 'CB1 load', fmt(s['VP1.CB1.Current'], 2), 'A', s['VP1.CB1.Current'] / 6, s['VP1.CB1.Current'] > 4.8)
  tile(884, 140, 'Enclosure', fmt(s['VP1.Enc.Temp'], 1), '°C', s['VP1.Enc.Temp'] / 60, s['VP1.Enc.Temp'] >= 45)
  // the panel one-line in miniature
  g.strokeStyle = '#44474c'; g.lineWidth = 4; g.fillStyle = '#1d1f22'; g.font = '600 24px Inter, Segoe UI, sans-serif'
  const y = 470
  g.beginPath(); g.moveTo(80, y); g.lineTo(1200, y); g.stroke()
  for (const [x, t1, t2] of [[160, 'FIELD', `${fmt(s['VP1.Field.Voltage'], 1)} V`], [420, 'CB1', s['VP1.CB1.Closed'] ? 'closed' : 'TRIPPED'], [700, 'HMI1', `${fmt(s['VP1.HMI1.Power'], 1)} W`], [980, 'TC1', `${fmt(s['VP1.TC1.Power'], 1)} W`]]) {
    g.fillStyle = '#f1f1ef'; g.fillRect(x - 90, y - 50, 180, 100); g.strokeRect(x - 90, y - 50, 180, 100)
    g.fillStyle = '#1d1f22'; g.textAlign = 'center'; g.fillText(t1, x, y - 10); g.font = '24px JetBrains Mono, Consolas, monospace'; g.fillStyle = t2 === 'TRIPPED' ? '#c8102e' : '#3a3d42'; g.fillText(t2, x, y + 26); g.font = '600 24px Inter, Segoe UI, sans-serif'
  }
  g.textAlign = 'left'
  // trend strip: bus voltage and enclosure temperature
  const hist = drawScreen.hist ?? (drawScreen.hist = [])
  hist.push([s['VP1.Bus.Voltage'], s['VP1.Enc.Temp']]); if (hist.length > 240) hist.shift()
  g.fillStyle = '#f3f3f1'; g.fillRect(26, 560, 1228, 214); g.strokeStyle = '#d0d1d3'; g.lineWidth = 2; g.strokeRect(26, 560, 1228, 214)
  g.fillStyle = '#5d6066'; g.font = '20px Inter, Segoe UI, sans-serif'; g.fillText('Trend · bus V (black) · enclosure °C (orange)', 40, 590)
  const line = (k, col, sc) => { g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); hist.forEach((r, i) => { const X = 40 + (i / 239) * 1200, Y = 760 - clamp(r[k] / sc) * 150; i ? g.lineTo(X, Y) : g.moveTo(X, Y) }); g.stroke() }
  line(0, '#1d1f22', 30); line(1, '#b0571a', 60)
  return 1
}

  'TC1 thin client': ['CONTEC 94115-03 (BX-T3020) fanless box computer, ThinManager Ready BIOS, no storage: it boots its client from the network. DC-IN 12–24 V. BOM item 4.', 'Keep the access clearance under its port face clear (sheet 6). Its DC-IN-3 sits on wire 100 from TB1-5.'],
  'CB1 breaker': ['Allen-Bradley 1489-M1C060: UL 489, 1 pole, curve C, 6 A. Protects wire 100 to HMI1, TC1 and the spare. BOM item 10.', 'On a current-limited field supply a short never reaches the magnetic trip: it clears on the thermal element, in tens of seconds.'],
  'TB1 terminals': ['1492-J4 feed-through terminals (brown +24 V, blue 0 V), 1492-JG4 ground terminals bonded to the rail, 1492-CJJ6-3 centre jumpers on TB1-4..6 and TB1-7..9, end anchors and partitions. BOM items 5–9, 11.', 'Device tags read from the CPME 1082-01 VFD200 schematics, unverified (sheet 1 note 2).'],
  'DIN rail': ['199-DR1 35 × 7.5 mm top hat rail, zinc plated and chromated, cut to 96.2 mm. It carries the PE bond from TB1-1 to TB1-10. BOM item 12.', 'Bond B-PE-EARTH-1-rail: the rail itself is the PE conductor between the two ground terminals.'],
  'Wireway': ['Panduit F2X2WH6 narrow slot 2 × 2 in duct, white, with C2WH6 covers: 3 × 21.03 in and 2 × 25.03 in. BOM items 13 and 14.', ''],
  'Wiring': ['Wire numbers per sheet 2: 24V field to CB1, 100 after CB1, 0V, PE. Blue +24 V, white 0 V, green PE as drawn here.', 'Wire is not itemised yet (sheet 7 note 1): sizes, colours and routes in this twin are drawn, not specified.'],
  'Wall': ['The mounting surface (sheet 5, rear view: wall mounting). Not part of the panel.', ''],
}
const tip = document.createElement('div'); tip.className = 'vp-tip'; lab.ui.appendChild(tip)
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2()
const partObjs = new Map(lab.parts.map((p) => [p.obj, p.name]))
partObjs.set(harness, 'Wiring')
const planes = ssBody.clippingPlanes
function pick(px_, py_) {
  mouse.set((px_ / innerWidth) * 2 - 1, -(py_ / innerHeight) * 2 + 1)
  ray.setFromCamera(mouse, lab.camera); ray.layers.set(0)
  for (const h of ray.intersectObject(lab.machine, true)) {
    if (!h.object.visible || h.object.userData.ghost) continue
    if (lab.state.cut > 0.02 && planes.every((pl) => pl.distanceToPoint(h.point) < 0)) continue
    if (lab.state.xray > 0.5 && lab.ghosts.includes(h.object)) continue
    let o = h.object; while (o && !partObjs.has(o)) o = o.parent
    const name = o && partObjs.get(o)
    if (name && NOTE[name]) return name
  }
  return null
}
function showTip(name, x, y) {
  if (!name) { tip.style.opacity = '0'; tip._n = null; return }
  if (tip._n !== name) { const [w, k] = NOTE[name]; tip.innerHTML = `<b>${name}</b>${w}${k ? `<div class="ck"><span>Review note</span>${k}</div>` : ''}`; tip._n = name }
  const Wd = tip.offsetWidth, Ht = tip.offsetHeight
  tip.style.left = `${clamp(x + 22, 8, innerWidth - Wd - 8)}px`; tip.style.top = `${clamp(y + 18, 8, innerHeight - Ht - 8)}px`; tip.style.opacity = '1'
}
let mx = -1, my = -1
lab.renderer.domElement.addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY })
lab.renderer.domElement.addEventListener('pointerleave', () => { mx = -1 })

// labels on the section, live values
const hmiAnchor = new THREE.Object3D(); hmi.add(hmiAnchor)      // hidden while the door is open, so its label never leaves the frame
lab.label(hmiAnchor, 'HMI1', { at: [-CUT.w / 2 + 0.06 - HX, CUT.cy + 0.12, D + 0.006 - HZ], value: () => T_('VP1.HMI1.On') ? `${fmt(T_('VP1.HMI1.Voltage'), 1)} V · ${fmt(T_('VP1.HMI1.Power'), 1)} W` : 'off' })
lab.label(tc1, 'TC1 thin client', { at: [(TC.x0 + TC.x1) / 2 - 0.04, TC.yT - 0.02, PZ + 0.055], value: () => `${['off', 'booting', 'running'][T_('VP1.TC1.Mode')]} · ${fmt(T_('VP1.TC1.Power'), 1)} W` })
lab.label(cb1, 'CB1 · 6 A', { at: [XCB, RY + 0.02, PZ + 0.0775], value: () => T_('VP1.CB1.Closed') ? `${fmt(T_('VP1.CB1.Current'), 2)} A · thermal ${fmt(T_('VP1.CB1.Thermal'))} %` : 'tripped' })
lab.label(tb, 'TB1-4..6 · wire 100', { at: [XT['TB1-5'], RY - 0.01, PZ + 0.045], value: () => `${fmt(T_('VP1.Bus.Voltage'), 2)} V` })
lab.label(tb, 'TB1-8 · 0 V', { at: [XT['TB1-8'], RY - 0.016, PZ + 0.04], value: () => `${fmt(T_('VP1.TB1_8.Temp'))} °C at the screw` })
lab.label(enc, 'Enclosure air', { at: [0.2, 0.66, 0.06], value: () => `${fmt(T_('VP1.Enc.Temp'), 1)} °C · settles ${fmt(T_('VP1.Enc.TempSettle'), 1)} °C` })

// ------------------------------------------------------------------ current you can see: streaks along the + conductors (the cutaway shows them)
const flowPaths = [PATHS.f24, PATHS.line, PATHS.load, PATHS.hmiPos, PATHS.tcPos]
const current = lab.flow({ paths: flowPaths.map((p) => p.map(([x, y, z]) => [x, y, z + R_W * 1.2])), count: 90, length: 0.12, parent: enc, seed: 5, color: () => {
  const v = clamp(T_('VP1.Bus.Voltage') / 24)
  return [lerp(0.95, 0.15, v), lerp(0.3, 0.55, v), lerp(0.1, 1.0, v)]
} })

// ------------------------------------------------------------------ door: swing it open on its hinge (D), a mode of its own
let doorOpen = 0, doorTarget = 0
function addDoorButton() {
  const m = lab.$('.lab-modes'), b = document.createElement('button'); b.dataset.k = 'door'; b.innerHTML = 'Open door<kbd>D</kbd>'
  const brk = m.querySelector('.brk'); m.insertBefore(b, brk)
  const sync = () => { b.classList.toggle('act', doorTarget > 0.5); b.firstChild.textContent = doorTarget > 0.5 ? 'Close door' : 'Open door' }
  b.addEventListener('click', (e) => { e.stopPropagation(); doorTarget = doorTarget > 0.5 ? 0 : 1; sync() })
  addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'd' && e.target.tagName !== 'INPUT') { doorTarget = doorTarget > 0.5 ? 0 : 1; sync() } })
  lab.door = (on, snap) => { doorTarget = on ? 1 : 0; if (snap) doorOpen = doorTarget; sync() }
}

// ------------------------------------------------------------------ run
let scrAcc = 1, tagAcc = 1, sparkT = -1, lastShort = false
const tmpV = V3(0, 0, 0)
lab.onTick((dt, lab, rawDt) => {
  // the solver: local unless the SCADA simulator is feeding the tags
  if (link.on && performance.now() - link.last > 3000) link.on = false
  if (!link.on) { panel.step(dt); snap = PM.snapshot(panel) }
  const s = snap.tags
  // sliders follow the tags (SCADA can move them)
  if (link.on && !dragging && !link.pending.size) { syncing = true; if (Math.abs(bl.value - s['VP1.HMI1.Backlight']) > 0.5) bl.set(s['VP1.HMI1.Backlight']); if (Math.abs(vf.value - s['VP1.Field.VoltageSP']) > 0.05) vf.set(s['VP1.Field.VoltageSP']); syncing = false }
  // the HMI picture and its brightness
  if ((scrAcc += dt) > 0.25 || lab.filmMode) { scrAcc = 0; const lum = drawScreen(); scrTex.needsUpdate = true; screenM.emissiveIntensity = lum ? lum * (0.25 + 1.45 * (s['VP1.HMI1.Backlight'] / 100)) : 0 }
  ledG.emissiveIntensity = s['VP1.TC1.Running'] ? 3 : 0; ledA.emissiveIntensity = s['VP1.TC1.Mode'] === 1 ? 3 : 0
  // CB1 toggle: on is up; tripped drops to the middle (as a thermal-magnetic breaker does), off is down
  const tAng = s['VP1.CB1.Closed'] ? -0.42 : snap.trip === 'manual' ? 0.42 : 0.1
  toggle.rotation.x = approach(toggle.rotation.x, tAng, 0.05, dt)
  // current streaks: speed from the CB1 current, shown inside the cut
  current.speed = 0.08 + 0.18 * clamp(s['VP1.CB1.Current'] / 3)
  current.opacity = (s['VP1.CB1.Current'] > 0.05 ? 1 : 0) * Math.max(lab.state.cut, lab.state.xray, doorOpen) * (1 - lab.state.explode)
  // the short: an arc at TB1-6 the moment it closes, then sparks while the supply pushes 12 A through it
  const sh = snap.short && s['VP1.CB1.Closed']
  if (sh && !lastShort) sparkT = 0
  lastShort = sh
  if (sh && sparkT >= 0 && sparkT < 0.8) {
    tmpV.set(XT['TB1-6'], RY - 0.024, ZE + 0.004); tb.localToWorld(tmpV)
    lab.sparks.emit(tmpV, sparkT === 0 ? 120 : 12, 0.6)
    sparkT += dt
  }
  // door swing and its service loop
  doorOpen = approach(doorOpen, doorTarget, 0.35, rawDt)
  const ang = ease(doorOpen) * 1.92
  doorPivot.rotation.y = -ang
  harness.visible = lab.state.explode < 0.02
  hmiAnchor.visible = doorOpen < 0.15
  if (Math.abs(ang - lastAng) > 0.003) { buildHarness(ang); lastAng = ang }
  // hero
  const I = s['VP1.CB1.Current'], cb = s['VP1.CB1.Closed']
  let state = 'normal', bad = false
  if (!cb) { state = snap.trip === 'thermal' ? 'CB1 tripped, thermal' : snap.trip === 'magnetic' ? 'CB1 tripped, magnetic' : 'CB1 open'; bad = true }
  else if (s['VP1.Supply.Limiting']) { state = 'supply in current limit'; bad = true }
  else if (s['VP1.Field.Voltage'] < 1) { state = 'no field supply'; bad = true }
  else if (s['VP1.TC1.Mode'] === 1) state = 'thin client booting'
  else if (!s['VP1.Bus.OK']) { state = 'bus out of tolerance'; bad = true }
  else if (s['VP1.Enc.Temp'] >= 45) state = 'enclosure warm'
  const th = s['VP1.CB1.Thermal'] / 100 * PM.P.thTrip, r2 = (I / PM.P.In) ** 2
  const tTrip = r2 > PM.P.thTrip ? PM.P.tauCb * Math.log((r2 - th) / (r2 - PM.P.thTrip)) : Infinity
  const sub = bad && cb && s['VP1.Supply.Limiting']
    ? `<span class="bad">Bus ${fmt(s['VP1.Bus.Voltage'], 2)} V · HMI1 and TC1 out · CB1 trips in ${fmt(Math.max(0, tTrip))} s on its thermal element (magnetic needs ${fmt(PM.P.magDC * PM.P.In)} A)</span>`
    : !cb ? `<span class="bad">Bus 0 V · HMI1 and TC1 off · reset CB1 at the panel</span>`
      : `Bus ${fmt(s['VP1.Bus.Voltage'], 2)} V · HMI1 ${fmt(s['VP1.HMI1.Power'], 1)} W · TC1 ${fmt(s['VP1.TC1.Power'], 1)} W · ${fmt(s['VP1.Enc.Temp'], 1)} °C inside`
  lab.setHero(I, { state, sub, bad })
  if (!lab.filmMode && (tagAcc += dt) > 0.2) { tagAcc = 0; drawTags(); tagsEl.style.opacity = String(1 - 0.85 * lab.state.labels) }
  showTip(!lab.filmMode && mx >= 0 ? pick(mx, my) : null, mx, my)
})
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2

// break it: a bolted short from the spare live terminal TB1-6 to 0 V
lab.breakIt({
  label: 'Short TB1-6',
  run() { if (link.on) post({ tag: 'VP1.Fault.ShortTB1_6', value: true }); else panel.inp.fShort = true },
  reset() {
    if (link.on) { post({ tag: 'VP1.Fault.ShortTB1_6', value: false }).then(() => post({ action: 'reset' })) }
    else { panel.inp.fShort = false; panel.resetCb1() }
  },
})

// ------------------------------------------------------------------ film: the standard story, with the door and the short
lab.autoFilm({
  runBeat: 'It runs on the panel’s own numbers.', runSub: 'Backlight up: HMI1 power and the CB1 current follow.', sliderTo: 1,
  breakBeat: 'Then short the spare terminal.', breakSub: 'The supply limits at 12 A: CB1 needs 35 s to trip.', breakCut: true,
})
{
  const f = lab.films.main
  // open on the finished panel, then build it
  Object.defineProperty(f, 'assemble', { get: () => lab.ft < 0.9 ? null : [0.9, 4.6] })
  const b2 = f.events.find((e) => e.beat?.[0] === '02'); if (b2) b2.beat = ['02', 'Claude builds the panel.', `From the review set: ${fmt(lab.partCount())} parts.`]
}
lab.start()
addDoorButton()
</script>
</body>
</html>
